<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">From Software to Silicon</title>
  <desc id="d">Abstract illustration of a microcontroller chip with circuit traces leading to a terminal prompt and a lock icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b3a50" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#03c9c9" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M480 250H360V140H220"/>
    <path d="M480 290H300V230H140"/>
    <path d="M480 340H330V420H180"/>
    <path d="M480 380H400V520H260"/>
    <path d="M720 260H840V160H960"/>
    <path d="M720 320H900V300H1040"/>
    <path d="M720 370H860V470H980"/>
    <path d="M560 210V110H640V60"/>
    <path d="M640 210V150H760V90"/>
    <path d="M580 420V540"/>
    <path d="M660 420V500H760V570"/>
  </g>
  <g fill="#03c9c9">
    <circle cx="220" cy="140" r="7"/><circle cx="140" cy="230" r="7"/>
    <circle cx="180" cy="420" r="7"/><circle cx="260" cy="520" r="7"/>
    <circle cx="960" cy="160" r="7"/><circle cx="1040" cy="300" r="7"/>
    <circle cx="980" cy="470" r="7"/><circle cx="640" cy="60" r="7"/>
    <circle cx="760" cy="90" r="7"/><circle cx="580" cy="540" r="7"/>
    <circle cx="760" cy="570" r="7"/>
  </g>

  <!-- chip -->
  <g>
    <g fill="#8aa4b8">
      <rect x="465" y="235" width="20" height="10"/><rect x="465" y="275" width="20" height="10"/>
      <rect x="465" y="315" width="20" height="10"/><rect x="465" y="355" width="20" height="10"/>
      <rect x="465" y="395" width="20" height="10"/>
      <rect x="715" y="235" width="20" height="10"/><rect x="715" y="275" width="20" height="10"/>
      <rect x="715" y="315" width="20" height="10"/><rect x="715" y="355" width="20" height="10"/>
      <rect x="715" y="395" width="20" height="10"/>
      <rect x="535" y="195" width="10" height="20"/><rect x="575" y="195" width="10" height="20"/>
      <rect x="615" y="195" width="10" height="20"/><rect x="655" y="195" width="10" height="20"/>
      <rect x="535" y="425" width="10" height="20"/><rect x="575" y="425" width="10" height="20"/>
      <rect x="615" y="425" width="10" height="20"/><rect x="655" y="425" width="10" height="20"/>
    </g>
    <rect x="485" y="215" width="230" height="210" rx="14" fill="#16212c" stroke="#3d5a70" stroke-width="3"/>
    <circle cx="510" cy="240" r="6" fill="#3d5a70"/>
    <!-- lock -->
    <path d="M575 305v-22a25 25 0 0 1 50 0v22" fill="none" stroke="#ffffff" stroke-width="8"/>
    <rect x="560" y="303" width="80" height="62" rx="8" fill="#ffffff"/>
    <circle cx="600" cy="328" r="8" fill="#16212c"/>
    <rect x="596" y="330" width="8" height="20" rx="3" fill="#16212c"/>
    <text x="600" y="400" fill="#8aa4b8" font-family="Menlo, Consolas, monospace" font-size="18" text-anchor="middle">UART · SPI · I²C</text>
  </g>

  <!-- terminal prompt -->
  <g font-family="Menlo, Consolas, monospace" font-size="26">
    <text x="60" y="590" fill="#03c9c9">$</text>
    <text x="85" y="590" fill="#d7e3ec">./roadmap --from software --to silicon</text>
    <rect x="670" y="568" width="14" height="28" fill="#d7e3ec"/>
  </g>
</svg>
